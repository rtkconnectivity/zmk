CONFIG_ZMK_BLE=y
CONFIG_BT_RTL87X2G=y

CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
CONFIG_BT_SUPPORT_STATIC_RANDOM_ADDRESS=y
CONFIG_BT_PRIVACY=y #need enable when pairing with ios device
#enable link key storage
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_LED=y

CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=18
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=18

CONFIG_WATCHDOG=y
CONFIG_ZMK_PPT=y

#zephyr heap
CONFIG_HEAP_MEM_POOL_SIZE=2048

# power manager settings
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
CONFIG_EXTRA_EXCEPTION_INFO=y
# CONFIG_PM_POLICY_CUSTOM=n # use zephyr pm flow, enable this config; use realtek pm flow, disable this config
# CONFIG_RUNTIME_NMI=y #customize NMI for power manager
# CONFIG_REALTEK_USING_SDK_LIB=y

# udc driver config
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_ZMK_USB=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_REMOTE_WAKEUP=y

# config usb cdc driver
# CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
# CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
# CONFIG_USBD_CDC_ACM_CLASS=y
# CONFIG_USB_CDC_FOR_RF_TEST=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# CONFIG_LOG_BUFFER_SIZE=4096

