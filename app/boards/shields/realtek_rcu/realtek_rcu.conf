# CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_IR=y
#CONFIG_PWM=y

# BLE configurations
CONFIG_ZMK_BLE=y
CONFIG_BT_RTL8752H=y
#enable link key storage
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_BT_MAX_PAIRED=3
CONFIG_BT_MAX_CONN=3
CONFIG_BT_SUPPORT_STATIC_RANDOM_ADDRESS=y
CONFIG_BT_PRIVACY=y #need enable when pairing with ios device

CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=18
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=18

#CONFIG_WATCHDOG=y

# power manager settings
